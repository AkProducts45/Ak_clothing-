
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK Clothing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial}
header{background:#000;padding:25px;text-align:center;border-bottom:2px solid #d6ad55}
header h1{color:#d6ad55;letter-spacing:4px}
header p{letter-spacing:5px;color:#aaa}
.hero{text-align:center;padding:65px 15px;background:linear-gradient(120deg,#17120a,#000)}
.hero h2{font-size:42px}
.hero span{color:#d6ad55}
.hero p{color:#bbb}
button{background:#d6ad55;color:black;border:0;padding:13px 20px;font-weight:bold;cursor:pointer}
h2.section{text-align:center;color:#d6ad55;margin:35px 0}
.search{display:block;width:85%;max-width:450px;margin:20px auto;padding:14px;background:#171717;border:1px solid #d6ad55;color:white}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px;max-width:1000px;margin:auto}
.card{background:#181818;border:1px solid #51401f;padding:12px;border-radius:8px}
.card img{width:100%;height:190px;object-fit:cover;background:#292929}
.card h3{font-size:17px}
.price{color:#d6ad55;font-size:20px;font-weight:bold}
.card button{width:100%;margin-top:8px}
#cart{padding:25px;text-align:center;background:#171717;margin:25px 15px}
footer{text-align:center;background:#000;padding:30px;color:#bbb;line-height:2;border-top:1px solid #d6ad55}
footer b{color:#d6ad55}
@media(min-width:700px){.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<h1>AK CLOTHING</h1>
<p>STYLE THAT FEELS LIKE YOU</p>
</header>

<div class="hero">
<h2>WEAR YOUR <span>OWN STYLE</span></h2>
<p>Premium Fashion | Modern Collection</p>
<button onclick="document.getElementById('shop').scrollIntoView()">SHOP NOW</button>
</div>

<h2 class="section" id="shop">OUR PRODUCTS</h2>
<input class="search" id="search" placeholder="Search products..." oninput="showProducts()">

<div class="products" id="products"></div>

<div id="cart">
<h2 style="color:#d6ad55">YOUR CART</h2>
<div id="items">Your cart is empty</div>
<h3 id="total">Total: Rs. 0</h3>
<button onclick="order()">ORDER ON WHATSAPP</button>
</div>

<footer>
<b>AK CLOTHING</b><br>
Lahore, Pakistan<br>
Cash On Delivery - Pakistan<br>
WhatsApp: 0308 6625610<br>
© 2026 AK Clothing
</footer>

<script>
const phone="923086625610";

const products=[
{name:"AK Black T-Shirt",price:1499,category:"T-Shirt",emoji:"👕"},
{name:"AK White T-Shirt",price:1399,category:"T-Shirt",emoji:"👕"},
{name:"AK Premium Hoodie",price:2499,category:"Hoodie",emoji:"🧥"},
{name:"AK Casual Shirt",price:1799,category:"Shirt",emoji:"👔"},
{name:"AK Oversized T-Shirt",price:1599,category:"T-Shirt",emoji:"👕"},
{name:"AK Winter Hoodie",price:2799,category:"Hoodie",emoji:"🧥"}
];

let cart=[];

function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=products
.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))
.map((p,i)=>`
<div class="card">
<div style="height:190px;display:grid;place-items:center;background:#292929;font-size:75px">${p.emoji}</div>
<h3>${p.name}</h3>
<p>${p.category}</p>
<div class="price">Rs. ${p.price}</div>
<button onclick="addCart('${p.name}')">ADD TO CART</button>
</div>`).join("");
}

function addCart(name){
let p=products.find(x=>x.name===name);
cart.push(p);
updateCart();
}

function updateCart(){
document.getElementById("items").innerHTML=cart.length?
cart.map((p,i)=>`<p>${p.name} - Rs. ${p.price} <button onclick="removeItem(${i})">X</button></p>`).join(""):"Your cart is empty";
document.getElementById("total").innerText="Total: Rs. "+cart.reduce((s,p)=>s+p.price,0);
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

function order(){
if(!cart.length){alert("Please add products first");return;}
let total=cart.reduce((s,p)=>s+p.price,0);
let message="Assalamualaikum! AK Clothing order:%0A"+
cart.map(p=>p.name+" - Rs. "+p.price).join("%0A")+
"%0ATotal: Rs. "+total;
window.open("https://wa.me/"+phone+"?text="+message,"_blank");
}

showProducts();
</script>
</body>
</html>
