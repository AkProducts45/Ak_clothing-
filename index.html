<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK ALI KHAN - Clothing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;z-index:10}
.logo{font-weight:900;font-size:22px} .logo span{color:#c9a227}
.topbar{text-align:center;background:#000;color:#fff;font-size:12px;padding:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff}
.card img{width:100%;height:220px;object-fit:cover}
.card-body{padding:10px}
.badge{background:#ff4d00;color:#fff;font-size:11px;padding:3px 6px;border-radius:4px;position:absolute;margin:8px}
.old{color:#888;text-decoration:line-through;font-size:13px} .new{color:#d00;font-weight:800}
.colors{margin:8px 0;display:flex;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;cursor:pointer}
.dot.active{border:2px solid #000}
.btn{width:100%;padding:10px;border-radius:20px;border:1px solid #00838f;background:#fff;color:#00838f;margin-top:6px;cursor:pointer}
.btn-fill{background:#00838f;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee}
#adminPanel{display:none;padding:15px;background:#fffbe6}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.thumbs{display:flex;gap:5px;margin-top:5px} .thumbs img{width:45px;height:45px;object-fit:cover;border:2px solid #eee;cursor:pointer}
</style>
</head>
<body>
<div class="topbar">AK ALI KHAN | Premium Hoodies in Pakistan | COD Available</div>
<header><div class="logo">AK <span>ALI KHAN</span></div><div>🔍 🛒 <span id="cartCount">0</span></div></header>

<div id="adminPanel">
<h2>Admin Panel - Sirf Aap Ke Liye</h2>
<p>Yahan se Aap product add / edit kar sakte hain.</p>
<input id="pName" placeholder="Product Name - jaise AK Premium Hoodie">
<input id="pOld" type="number" placeholder="Purani Price - 2999">
<input id="pNew" type="number" placeholder="Sale Price - 2499">
<input id="pImg1" placeholder="Pic 1 ka Link">
<input id="pImg2" placeholder="Pic 2 ka Link - Black Colour">
<input id="pImg3" placeholder="Pic 3 ka Link - White Colour">
<button class="btn btn-fill" onclick="addProduct()">+ Product Add Karein</button>
<p style="font-size:12px;margin-top:8px">Customer ko ye panel nazar nahi aayega. Aap ka link #admin wala hai.</p>
</div>

<div style="text-align:center;padding:15px"><h2>Products</h2></div>
<div class="grid" id="grid"></div>

<div style="height:70px"></div>
<div class="bottom"><div>Shop</div><div>❤️ Wishlist</div><div>🛒 Cart</div><div>👤 Account</div><div>🔍 Search</div></div>

<script>
let products = JSON.parse(localStorage.getItem('ak_products')) || [
 {name:"AK Premium Hoodie - Black Edition",old:2999,new:2499,imgBlack:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600",imgWhite:"https://images.unsplash.com/photo-1578681994506-b8f463449011?w=600",imgs:["https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600","https://images.unsplash.com/photo-1578681994506-b8f463449011?w=600"]},
 {name:"AK JUPITER Hoodie",old:3499,new:2799,imgBlack:"https://images.unsplash.com/photo-1509942774463-acf339cf87d5?w=600",imgWhite:"https://images.unsplash.com/photo-1611312449408-fcece27cdbb7?w=600",imgs:["https://images.unsplash.com/photo-1509942774463-acf339cf87d5?w=600","https://images.unsplash.com/photo-1611312449408-fcece27cdbb7?w=600"]}
];
let cart=0;
function render(){
 let g=document.getElementById('grid'); g.innerHTML='';
 products.forEach((p,i)=>{
  let disc=Math.round((1-p.new/p.old)*100);
  g.innerHTML+=`<div class="card">
   <div style="position:relative"><span class="badge">-${disc}%</span>
   <img id="main${i}" src="${p.imgs[0]}"></div>
   <div class="card-body">
   <b>${p.name}</b><br><span class="old">Rs.${p.old}.00</span> <span class="new">Rs.${p.new}.00</span>
   <div class="colors">
    <div class="dot active" style="background:#000" onclick="changeColor(${i},'black',this)"></div>
    <div class="dot" style="background:#fff" onclick="changeColor(${i},'white',this)"></div>
   </div>
   <div class="thumbs">${p.imgs.map(u=>`<img src="${u}" onclick="document.getElementById('main${i}').src='${u}'">`).join('')}</div>
   <button class="btn" onclick="alert('${p.name} Quick View')">Quick View</button>
   <button class="btn btn-fill" onclick="addToCart()">Quick Shop - Add to Cart</button>
   ${isAdmin?`<button class="btn" style="color:red" onclick="deleteP(${i})">Admin: Delete</button>`:''}
   </div></div>`;
 });
}
function changeColor(i,color,el){
 document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active')); el.classList.add('active');
 let p=products[i];
 document.getElementById('main'+i).src = color==='black' ? p.imgBlack : p.imgWhite;
}
function addToCart(){cart++; document.getElementById('cartCount').innerText=cart; alert('Cart me add ho gaya!')}
function addProduct(){
 let p={name:document.getElementById('pName').value, old:+document.getElementById('pOld').value, new:+document.getElementById('pNew').value,
 imgBlack:document.getElementById('pImg2').value, imgWhite:document.getElementById('pImg3').value,
 imgs:[document.getElementById('pImg1').value, document.getElementById('pImg2').value, document.getElementById('pImg3').value]};
 products.push(p); localStorage.setItem('ak_products',JSON.stringify(products)); render(); alert('Product add ho gaya!');
}
function deleteP(i){products.splice(i,1); localStorage.setItem('ak_products',JSON.stringify(products)); render();}
let isAdmin = location.hash==='#admin';
if(isAdmin) document.getElementById('adminPanel').style.display='block';
render();
</script>
</body>
</html>
